name: Build BitChord exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Windows mengubah LF jadi CRLF saat checkout, dan itu merusak patch.
      - name: Matikan konversi CRLF
        run: git config --global core.autocrlf false

      # Repo-mu sendiri: berisi bitchord-all-changes.patch
      - uses: actions/checkout@v5
        with:
          path: mine

      # Source resmi, dikunci ke commit yang cocok dengan patch
      - uses: actions/checkout@v5
        with:
          repository: jackychan4891/BitChord-PC-Official
          ref: 7ed3e48450d8c51b76c1b429855079e515a4e723
          path: src

      - name: Apply patch
        shell: bash
        run: |
          cd src
          git apply --whitespace=nowarn ../mine/bitchord-all-changes.patch

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Build
        working-directory: src
        run: cargo build --release --locked

      - name: Stage files
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\bitchord.exe out\
          $found = Get-ChildItem -Path target -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue
          $x64 = $found | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if ($x64) { Copy-Item $x64.FullName out\ }
          Get-ChildItem out

      - uses: actions/upload-artifact@v5
        with:
          name: bitchord-windows
          path: src/out/
